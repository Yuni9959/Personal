<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111426" />
  <meta name="description" content="개인 웹앱과 자주 쓰는 도구를 한곳에서 여는 Personal Tap" />
  <title>Personal Tap</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./hub.css?v=automation-hub-1" />
  <link rel="stylesheet" href="./pwa-update.css" />
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="shell">
    <header class="topbar">
      <a class="identity" href="./" aria-label="Personal Tap 홈">
        <span class="identity-mark">PT</span>
        <span class="identity-copy">
          <strong>Personal Tap</strong>
          <small>승윤님의 개인 앱 허브</small>
        </span>
      </a>

      <div class="top-actions">
        <span id="connectionBadge" class="status-chip"><i></i><span>온라인</span></span>
        <button id="installBtn" class="install-button hidden" type="button">앱 설치</button>
      </div>
    </header>

    <main>
      <nav class="hub-navigation" aria-label="Personal Tap 메뉴">
        <a class="apps-tab" href="./" aria-current="page">My Apps</a>
        <section id="healthPanel" class="automation-overview" data-level="yellow" aria-label="자동화 상태">
          <div class="automation-topline">
            <a class="automation-link" href="./apps/automation-status/">자동화 상태 <span aria-hidden="true">↗</span></a>
            <div class="automation-signal" role="status" aria-live="polite">
              <span class="traffic-light" aria-hidden="true"><i class="lamp red"></i><i class="lamp yellow"></i><i class="lamp green"></i></span>
              <strong id="healthLabel">점검 필요</strong>
            </div>
            <button id="refresh" type="button">확인하기</button>
          </div>
          <p id="healthReason">현재 상태를 확인하고 있습니다.</p>
          <p id="healthTime">마지막 확인: 기록 없음</p>
          <p id="localMessage" hidden></p>
          <p id="summary" class="sr-only" role="status" aria-live="polite">확인 준비 중</p>
        </section>
      </nav>
      <section class="section-block app-launcher" aria-labelledby="appsTitle">
        <div class="section-heading">
          <div>
            <h1 id="appsTitle">My Apps</h1>
          </div>
          <p id="lastOpened" class="last-opened">아직 방문 기록이 없습니다.</p>
        </div>
        <div id="appGrid" class="app-grid"></div>
      </section>

    </main>

    <footer>
      <span>Personal Tap</span>
      <span>한 번의 탭으로, 필요한 곳까지.</span>
    </footer>
  </div>

  <noscript>이 페이지는 JavaScript가 필요합니다.</noscript>
  <script src="./apps.js"></script>
  <script type="module" src="./hub.js"></script>
  <script type="module" src="./apps/automation-status/app.js?v=traffic-2"></script>
  <script src="./pwa-update.js"></script>
</body>
</html>
