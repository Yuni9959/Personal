name: Deploy Personal Tap with market snapshot

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh delayed MNQ snapshot
        run: node apps/volatility/tools/update-market-data.mjs --allow-stale
      - name: Stage static site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.tmp' --exclude 'node_modules' --exclude '_site' ./ _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
